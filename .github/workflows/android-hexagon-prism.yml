name: Build llama.cpp Android CPU + Hexagon + Vulkan (PrismML)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_FILE: llama.cpp-android-prism-full.tar.gz
  RELEASE_TAG: llama-prism-phone-latest

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout llama.cpp (PrismML fork)
        uses: actions/checkout@v4
        with:
          repository: PrismML-Eng/llama.cpp
          ref: prism
          fetch-depth: 1

      - name: Record upstream commit
        run: echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build Android CPU + Hexagon + Vulkan
        run: |
          docker run --rm \
            --platform linux/amd64 \
            -u "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            ghcr.io/snapdragon-toolchain/arm64-android:v0.8 \
            bash -lc '
              set -euo pipefail
              cd /workspace

              echo "=== Toolchain environment ==="
              echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
              echo "HEXAGON_SDK_ROOT=$HEXAGON_SDK_ROOT"
              echo "HEXAGON_TOOLS_ROOT=$HEXAGON_TOOLS_ROOT"
              command -v glslc || true
              command -v glslangValidator || true

              cp docs/backend/snapdragon/CMakeUserPresets.json .
              rm -rf build-snapdragon pkg-snapdragon

              echo "=== Configure: CPU + Hexagon + Vulkan ==="
              cmake --preset arm64-android-snapdragon-release \
                -B build-snapdragon \
                -DBUILD_SHARED_LIBS=ON \
                -DGGML_HEXAGON=ON \
                -DGGML_VULKAN=ON \
                -DGGML_VULKAN=ON \
                -DVulkan_GLSLC_EXECUTABLE="$ANDROID_NDK_ROOT/shader-tools/linux-x86_64/glslc" \
                -DGGML_OPENCL=OFF \
                -DGGML_OPENMP=OFF \
                -DGGML_LLAMAFILE=OFF \
                -DGGML_CPU_REPACK=ON \
                -DLLAMA_BUILD_TESTS=OFF \
                -DLLAMA_BUILD_EXAMPLES=ON \
                -DLLAMA_BUILD_SERVER=ON

              echo "=== Verify configured backends ==="
              grep -E "^(GGML_HEXAGON|GGML_VULKAN|GGML_OPENCL|GGML_CPU_REPACK):" build-snapdragon/CMakeCache.txt || true
              grep -q "^GGML_HEXAGON:BOOL=ON$" build-snapdragon/CMakeCache.txt

              echo "=== Build ==="
              cmake --build build-snapdragon --parallel 2

              echo "=== Install ==="
              cmake --install build-snapdragon \
                --prefix pkg-snapdragon/llama.cpp

              echo "=== Verify package ==="
              test -f pkg-snapdragon/llama.cpp/bin/llama-cli
              test -f pkg-snapdragon/llama.cpp/lib/libggml-cpu.so
              test -f pkg-snapdragon/llama.cpp/lib/libggml-hexagon.so
              test -f pkg-snapdragon/llama.cpp/lib/libggml-htp-v81.so

              echo "=== Installed files ==="
              find pkg-snapdragon/llama.cpp -maxdepth 2 -type f | sort
            '

      - name: Package
        run: |
          set -euo pipefail
          cd pkg-snapdragon
          tar -czf "../$PACKAGE_FILE" llama.cpp

      - name: Create build metadata
        run: |
          set -euo pipefail
          sha256sum "$PACKAGE_FILE" > SHA256SUMS
          printf '%s\n' \
            "repository=$GITHUB_REPOSITORY" \
            "source=PrismML-Eng/llama.cpp@prism" \
            "commit=$UPSTREAM_SHA" \
            "backends=CPU,Hexagon,Vulkan" \
            "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama.cpp-android-prism-full
          path: |
            ${{ env.PACKAGE_FILE }}
            SHA256SUMS
            BUILD_INFO.txt
          if-no-files-found: error

      - name: Publish rolling Termux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          printf '%s\n' \
            "PrismML fork — CPU + Hexagon + Vulkan for Termux." \
            "" \
            "Source: PrismML-Eng/llama.cpp@prism" \
            "Commit: $UPSTREAM_SHA" \
            "Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$notes_file"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "llama.cpp PrismML Android (CPU+Hexagon+Vulkan)" \
              --notes-file "$notes_file" --prerelease
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "llama.cpp PrismML Android (CPU+Hexagon+Vulkan)" \
              --notes-file "$notes_file" --prerelease
          fi

          gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" SHA256SUMS BUILD_INFO.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
